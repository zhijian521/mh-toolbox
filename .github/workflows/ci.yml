name: Checks
on:
    push:
    pull_request:
# 同一分支的新提交取消旧运行：过期结果没有价值，还会占满并发额度。
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    legacy:
        runs-on: windows-latest
        env:
            # npm ci 的 postinstall 会下载 Electron，缓存到工作区内再交给 actions/cache。
            ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
            ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        defaults:
            run:
                working-directory: migration/baseline
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: migration/baseline/package-lock.json
            - uses: actions/cache@v4
              with:
                  path: .cache
                  key: ${{ runner.os }}-electron-legacy-${{ hashFiles('migration/baseline/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-electron-legacy-
            - run: npm ci
            - run: npm run check
            - run: npm test
            - run: npm run test:electron
    v2:
        runs-on: windows-latest
        env:
            ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
            ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        steps:
            # 提交信息要与基准点比较，因此取完整历史。
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: package-lock.json
            # 只校验本次带来的提交，历史提交不在范围内。
            - name: 校验提交信息
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
                  elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
                      RANGE="${{ github.event.before }}..${{ github.event.after }}"
                  else
                      RANGE="HEAD~1..HEAD"
                  fi
                  git log --no-merges --format=%s "$RANGE" | node scripts/check-commits.mjs
            - uses: actions/cache@v4
              with:
                  path: .cache
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-electron-
            - run: npm ci
            - run: npm run check
            # test:electron 读取 dist/renderer 构建产物，必须先 build。
            - run: npm run build
            - run: npm run test:electron
